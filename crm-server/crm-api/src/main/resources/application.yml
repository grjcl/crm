server:
  port: 8080

spring:
  application:
    name: crm-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.1.53:5432/crm}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    # 复用 shared/db 下已建好的 V1/V2/V3，不重写、不复制
    locations: filesystem:../shared/db
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:192.168.1.53}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}

  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

crm:
  jwt:
    secret: ${JWT_SECRET:crm-dev-secret-key-change-in-production-min-32-chars}
    access-ttl: 2h
    refresh-ttl: 30d
