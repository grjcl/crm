<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>商旅酒店分销 CRM · 一期可交互原型</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#1F3864;--navy2:#2C4C86;--blue:#2F6FD0;
  --bg:#F2F4F8;--card:#fff;--line:#E8EBF1;
  --txt:#161A22;--sub:#6B7280;--mute:#9AA3AF;
  --green:#2E7D4F;--greenbg:#E7F4EC;--amber:#9A6400;--amberbg:#FFF3DC;
  --red:#C0392B;--redbg:#FCE9E7;
  --sh:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
}
html,body{height:100%}
body{margin:0;color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:radial-gradient(1100px 620px at 18% -8%,#DDE8FA 0%,#EEF2F8 46%,#E6EAF1 100%);
  -webkit-font-smoothing:antialiased}
.shell{display:flex;gap:26px;justify-content:center;align-items:flex-start;padding:26px 22px 46px;min-height:100%}
.rail{width:236px;flex:none;position:sticky;top:26px}
.rail-right{width:262px}
.rail-title{font-size:11px;letter-spacing:.14em;color:#8A94A6;font-weight:700;margin:0 0 10px 10px}
.rail-group{font-size:10.5px;color:#98A2B3;font-weight:700;letter-spacing:.08em;margin:14px 0 4px 10px}
.rail-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:9px;
  font-size:13px;color:#3A4863;cursor:pointer;transition:.14s;font-family:inherit}
.rail-item:hover{background:rgba(255,255,255,.75)}
.rail-item.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:var(--sh)}
.rail-item .rq{font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums;flex:none}
.rail-item.on .rq{color:var(--blue)}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.caption{font-size:11.5px;color:#8A94A6;text-align:center;line-height:1.6}
/* phone */
.phone{position:relative;width:390px;height:844px;background:#0B0D12;border-radius:54px;padding:12px;
  box-shadow:0 40px 70px -26px rgba(15,25,50,.5),inset 0 0 0 1px rgba(255,255,255,.08)}
.island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:104px;height:26px;
  background:#0B0D12;border-radius:15px;z-index:30}
.app{position:relative;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);
  display:flex;flex-direction:column}
.statusbar{height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 24px 6px;font-size:13px;font-weight:600;letter-spacing:.02em;background:transparent;z-index:25}
.statusbar .ic{display:flex;align-items:center;gap:5px}
.viewport{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;position:relative}
.viewport::-webkit-scrollbar{display:none}
.tabbar{flex:none;height:58px;display:flex;background:#fff;border-top:1px solid #EAEDF3;z-index:10}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:10px;color:#98A2B3;cursor:pointer;font-family:inherit;padding:0}
.tabbar button.on{color:var(--navy);font-weight:600}
.tabbar svg{width:21px;height:21px}
.homebar{flex:none;height:20px;background:#fff;display:flex;justify-content:center;align-items:center}
.homebar i{width:120px;height:4px;border-radius:3px;background:#D5DAE3}
/* generic */
.navbar{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:6px;height:48px;padding:0 8px 0 4px;
  background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid #EDEFF4}
.navbar .nt{font-size:16px;font-weight:700;letter-spacing:.01em}
.navbar .nr{margin-left:auto;display:flex;gap:4px;padding-right:6px}
.iconbtn{width:34px;height:34px;border-radius:10px;border:0;background:transparent;display:flex;align-items:center;
  justify-content:center;color:#3A4863;cursor:pointer}
.iconbtn:active{background:#EEF1F6}
.back{width:34px;height:34px;border:0;background:transparent;color:var(--navy);cursor:pointer;
  display:flex;align-items:center;justify-content:center;border-radius:10px}
.pad{padding:14px}
.sec{font-size:11.5px;color:#8A94A6;font-weight:700;letter-spacing:.09em;margin:16px 4px 8px}
.card{background:var(--card);border-radius:15px;box-shadow:var(--sh)}
.muted{color:var(--sub)}
.tiny{font-size:11.5px;color:var(--mute);line-height:1.55}
.hr{height:1px;background:var(--line);margin:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2.5px 8px;border-radius:999px;
  background:#EEF1F6;color:#55637C;font-weight:600;white-space:nowrap}
.pill.blue{background:#E9EFFB;color:#2C4C86}
.pill.green{background:var(--greenbg);color:var(--green)}
.pill.amber{background:var(--amberbg);color:var(--amber)}
.pill.red{background:var(--redbg);color:var(--red)}
.pill.grey{background:#F1F3F7;color:#8A94A6}
.navbar .searchbox{flex:1;display:flex;align-items:center;gap:7px;background:#EEF1F6;border-radius:10px;
  padding:6px 10px;margin-left:4px;animation:fadein .16s ease}
@keyframes fadein{from{opacity:.35;transform:scaleX(.97)}to{opacity:1;transform:none}}
.navbar .searchbox input{border:0;background:transparent;outline:none;font-size:13.5px;width:100%;
  font-family:inherit;color:#1F2937}
.navbar .cancel{border:0;background:transparent;color:#2C4C86;font-size:14px;font-family:inherit;
  padding:0 6px;cursor:pointer;font-weight:600}
.sheet{max-height:88%;overflow-y:auto}
.row .pl{font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:6px;color:#5A6A85;
  white-space:nowrap;overflow:hidden}
.row .pl b{flex:none;font-size:10.5px;padding:1.5px 7px;border-radius:6px;background:#EDF3FF;
  color:#2C4C86;font-weight:700}
.row .pl.late b{background:#FCE9E7;color:#C0392B}
.row .pl.today b{background:#FFF3DC;color:#9A6400}
.row .pl.none b{background:#F1F3F7;color:#8A94A6}
.pin{font-size:9.5px;padding:1px 6px;border-radius:5px;background:#1F3864;color:#fff;
  font-weight:700;margin-left:6px;vertical-align:2px}
.plancard{background:#fff;border-radius:15px;box-shadow:var(--sh);margin:14px 14px 0;overflow:hidden}
.plancard .planh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;
  border-bottom:1px solid #F1F3F7}
.plancard .planh > div:first-child{flex:1;min-width:0}
.planrow{display:flex;align-items:flex-start;gap:11px;padding:13px 14px}
.planrow .dt{flex:none;width:54px;text-align:center;border-radius:11px;background:#EDF3FF;color:#2C4C86;
  padding:7px 0 6px;font-weight:700;font-size:13px;line-height:1.35}
.planrow .dt span{display:block;font-size:9.5px;font-weight:600;margin-top:2px;opacity:.85}
.planrow .dt.late{background:#FCE9E7;color:#C0392B}
.pdate{flex:none;font-size:11.5px;font-weight:700;color:#2C4C86;background:#EDF3FF;padding:2.5px 7px;
  border-radius:6px}
.pdate.late{background:#FCE9E7;color:#C0392B}
.pdate.today{background:#FFF3DC;color:#9A6400}
.planrow .dt.today{background:#FFF3DC;color:#9A6400}
.sheet .chip{padding:5px 10px;font-size:12px}
.tag{display:inline-block;font-size:10px;padding:1.5px 7px;border-radius:6px;background:#EDF1F9;
  color:#3A5078;font-weight:600;margin-right:4px}
/* 我的（微信风） */
.mine-head{display:flex;align-items:center;gap:14px;padding:26px 18px 22px;background:#fff}
.mine-head .av{width:62px;height:62px;border-radius:10px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:23px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2C4C86,#1F3864)}
.mine-head .nm{font-size:19px;font-weight:700;letter-spacing:.01em}
.mine-head .id{font-size:12.5px;color:#8A94A6;margin-top:5px}
.mine-card{background:#fff;margin:10px 0 0}
.mine-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #F2F4F8;
  font-size:15px;color:#1F2937;cursor:pointer}
.mine-row:last-child{border-bottom:0}
.mine-row:active{background:#F7F8FA}
.mine-row .mi{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center}
.mine-row .ml{flex:1}
.mine-row .mv{font-size:13px;color:#9AA3AF;margin-right:2px}
/* 标签管理 */
.tagrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F2F4F8}
.tagrow input{flex:1;min-width:0;border:0;outline:none;font-size:15px;font-family:inherit;color:#1F2937;
  background:transparent;padding:4px 0}
.tagrow .del{width:30px;height:30px;border-radius:9px;border:0;background:#F5F6FA;color:#9AA3AF;
  font-size:17px;line-height:1;cursor:pointer;flex:none}
.tagrow .del:active{background:#FCE9E7;color:#C0392B}
/* list */
.searchwrap{padding:10px 14px 4px;background:#fff}
.search{display:flex;align-items:center;gap:8px;background:#EEF1F6;border-radius:11px;padding:8px 11px}
.search input{border:0;background:transparent;outline:none;font-size:13.5px;width:100%;font-family:inherit;color:#1F2937}
.search svg{width:15px;height:15px;color:#98A2B3;flex:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 14px 11px;background:#fff;border-bottom:1px solid #EDEFF4;
  position:sticky;top:48px;z-index:11;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:5px 12px;border-radius:999px;background:#F3F5F9;border:1px solid transparent;font-size:12.5px;
  color:#55637C;white-space:nowrap;cursor:pointer;font-family:inherit}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.list{background:#fff;border-radius:15px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-bottom:1px solid #F1F3F7;cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:#F7F9FC}
.row .avatar{margin-top:1px}
.row .main{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:600;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:#8A94A6;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .f{font-size:11.5px;color:#8A94A6;margin-top:5px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.row > .pill{flex:none;margin-top:1px}
.avatar{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;background:#EDF1F9;color:var(--navy)}
.avatar.sq{background:#F3EDE4;color:#8A5A20}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;background:#B9C1CF}
.dot.on{background:#38A169}
.dot.pause{background:#D69E2E}
.dot.off{background:#CBD2DE}
/* company hero */
.hero{margin:14px 14px 0;border-radius:18px;padding:16px 16px 14px;color:#fff;
  background:linear-gradient(135deg,#22385F 0%,#1F3864 45%,#2C4C86 100%);box-shadow:0 14px 30px -14px rgba(31,56,100,.65)}
.hero .hn{font-size:17.5px;font-weight:700;line-height:1.35;letter-spacing:.01em}
.hero .hm{font-size:12px;opacity:.78;margin-top:5px}
.hero .tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.hero .tags span{font-size:10.5px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.16)}
.hero .tags span.solid{background:#fff;color:var(--navy);font-weight:700}
.metrics{display:flex;background:#fff;margin:-10px 20px 0;border-radius:15px;box-shadow:var(--sh);
  padding:12px 6px;position:relative;z-index:2}
.metrics div{flex:1;text-align:center;border-right:1px solid #F0F2F7}
.metrics div:last-child{border:0}
.metrics b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.metrics i{display:block;font-style:normal;font-size:10.5px;color:#8A94A6;margin-top:2px}
.segs{display:flex;gap:2px;margin:14px 14px 0;background:#E7EAF1;border-radius:11px;padding:3px}
.segs button{flex:1;border:0;background:transparent;padding:6px 2px;font-size:12.5px;border-radius:9px;
  color:#5A6A85;cursor:pointer;font-family:inherit;white-space:nowrap}
.segs button.on{background:#fff;color:var(--navy);font-weight:700;box-shadow:0 1px 3px rgba(16,24,40,.12)}
/* info */
.info{padding:4px 14px}
.info .ri{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #F1F3F7;font-size:13px}
.info .ri:last-child{border-bottom:0}
.info .ri b{font-weight:500;color:#8A94A6;flex:none}
.info .ri span{color:#1F2937;text-align:right;line-height:1.45}
/* timeline */
.tl{padding:6px 14px 4px}
.tl .it{position:relative;padding:0 0 18px 22px;border-left:1px solid #E3E8F1;margin-left:5px}
.tl .it:last-child{border-left-color:transparent;padding-bottom:4px}
.tl .it::before{content:"";position:absolute;left:-5px;top:2px;width:9px;height:9px;border-radius:50%;
  background:#fff;border:2px solid var(--blue)}
.tl .it.f::before{border-color:#C9D1E0}
.tl .hd{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8A94A6;margin-bottom:5px}
.tl .bd{font-size:13px;line-height:1.6;color:#28313F}
.tl .nx{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:11px;color:#2C6B4F;
  background:var(--greenbg);padding:3px 8px;border-radius:7px}
/* action bar */
.actionbar{position:sticky;bottom:0;display:flex;gap:9px;padding:10px 14px 14px;
  background:linear-gradient(180deg,rgba(242,244,248,.55) 0%,rgba(242,244,248,.97) 38%,#F2F4F8 62%);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn{flex:1;height:45px;border-radius:13px;border:0;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:active{background:#16294A}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:var(--sh)}
.btn.small{height:36px;font-size:13px;border-radius:10px;flex:none;padding:0 14px}
.btn.line{background:#fff;color:#55637C;box-shadow:inset 0 0 0 1px #E1E6EF}
/* deal */
.stagebar{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 6px 6px;position:relative}
.stagebar .sp{flex:1;text-align:center;position:relative;font-size:10.5px;color:#98A2B3}
.stagebar .sp .n{width:22px;height:22px;border-radius:50%;background:#EDF0F6;color:#98A2B3;margin:0 auto 6px;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;position:relative;z-index:2}
.stagebar .sp.done .n{background:var(--navy);color:#fff}
.stagebar .sp.cur .n{background:#fff;color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.stagebar .sp.cur{color:var(--navy);font-weight:700}
.stagebar .line{position:absolute;left:12%;right:12%;top:11px;height:2px;background:#E4E9F2;z-index:1}
.stagebar .line i{display:block;height:100%;background:var(--navy);border-radius:2px}
/* misc */
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:9px 0;border-bottom:1px solid #F3F5F9}
.kv:last-child{border:0}
.kv b{color:#8A94A6;font-weight:500}
.kv span{font-weight:600}
.seg-line{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:#9AA3AF;font-size:12.5px;padding:34px 0}
.banner{margin:12px 14px 0;border-radius:13px;padding:11px 12px;background:#EDF3FF;color:#2C4C86;
  font-size:12px;line-height:1.55;display:flex;gap:9px;align-items:flex-start}
.banner .bl{font-weight:700;flex:none;white-space:nowrap}
.banner > span:last-child{flex:1;min-width:0}
.banner a{color:var(--blue);text-decoration:none;font-weight:700}
.fab-line{display:flex;gap:8px;padding:12px 14px 0}
/* form */
.form{padding:6px 14px}
.field{padding:11px 0;border-bottom:1px solid #F1F3F7}
.field label{display:block;font-size:12px;color:#8A94A6;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:0;outline:none;font-size:14.5px;font-family:inherit;
  color:#1F2937;background:transparent;resize:none;line-height:1.55}
.field .hint{font-size:11px;color:#A6AEBC;margin-top:5px}
textarea#f-text{display:block;width:100%;min-height:96px;background:#F7F9FC;border:0;border-radius:11px;
  padding:11px;margin-top:2px;font-family:inherit;font-size:14px;line-height:1.55;color:#1F2937;outline:none;resize:none}
.voice{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-radius:14px;
  box-shadow:var(--sh);margin-top:10px;cursor:pointer;user-select:none}
.voice .mic{width:38px;height:38px;border-radius:50%;background:#EDF1F9;color:var(--navy);display:flex;
  align-items:center;justify-content:center;flex:none}
.voice.on .mic{background:var(--redbg);color:var(--red)}
.voice .vt{font-size:13.5px;font-weight:600}
.voice .vs{font-size:11px;color:#A6AEBC;margin-top:2px}
.photos{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 0}
.ph{width:64px;height:64px;border-radius:11px;background:#F4F6FA;display:flex;align-items:center;
  justify-content:center;color:#A6AEBC;font-size:11px;flex-direction:column;gap:3px}
.ph.add{border:1px dashed #D3DAE6;cursor:pointer}
.ph img{display:none}
/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:rgba(22,28,40,.92);color:#fff;font-size:12.5px;padding:9px 15px;border-radius:11px;
  max-width:300px;text-align:center;line-height:1.5;transition:.24s;z-index:60;backdrop-filter:blur(6px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* modal */
.mask{position:absolute;inset:0;background:rgba(16,22,34,.42);z-index:50;display:flex;align-items:flex-end}
.sheet{width:100%;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px 22px;animation:up .22s ease}
@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
.sheet h4{margin:0 0 4px;font-size:15.5px}
.sheet p{margin:0 0 12px;font-size:12px;color:#8A94A6}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.opt button{padding:8px 13px;border-radius:10px;border:1px solid #E4E8F0;background:#fff;font-size:13px;
  color:#3A4863;font-family:inherit;cursor:pointer}
.opt button.on{background:#EDF3FF;border-color:#C7D8F7;color:var(--navy);font-weight:700}
@media (max-width:1180px){.rail-left{display:none}}
@media (max-width:940px){
  html,body{overflow:hidden;height:100%}
  .shell{display:block;padding:0;gap:0;height:100%;overflow:hidden}
  .rail{display:none}
  .stage{display:block;width:100%;height:100%}
  .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}
  .island{display:none}
  .app{border-radius:0;height:100%}
  .caption{display:none}
  .statusbar{height:44px;padding:0 20px 6px}
}
/* ---- 待跟进列表（新增，PRD 12.9） ---- */
.tl .hd{justify-content:space-between}
.itmore{border:0;background:transparent;color:#C2C9D6;font-size:15px;line-height:1;padding:0 2px;letter-spacing:1px}
.todobar{padding:10px 14px 0;font-size:11.5px;color:#9AA3AF}
.todosec{margin-top:13px}
.todosec-h{display:flex;align-items:center;gap:7px;padding:0 14px 7px;font-size:12px;font-weight:600;color:#3A465C}
.todosec-n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#E7EAF1;color:#5A6A85;
  font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.is-late .todosec-h{color:#C0392B}
.is-late .todosec-n{background:#FCE9E7;color:#C0392B}
.todoi{display:flex;align-items:center;gap:10px;margin:0 14px 8px;padding:11px 13px;background:#fff;
  border-radius:15px;box-shadow:var(--sh)}

const planShort = d => d.slice(5).replace('-', '-');
const sortByPlan = list => list.slice().sort((a, b) => {
  const pa = planOf(a.id), pb = planOf(b.id);
  if (!pa && !pb) return 0;
  if (!pa) return 1;
  if (!pb) return -1;
  return pa.date.localeCompare(pb.date) || a.name.localeCompare(b.name);
});

    S.hist.push({s:S.screen, p:S.param, c:S.ctab});

  S.screen = screen; S.param = param || null;
  S.ctab = '概览'; S.leadSeg = S.leadSeg || 'pool';
  S.q = ''; S.searching = false; S.draft = {};
  S.newType = null; S.newLines = []; S.newStatus = null; S.newLevel = null; S.newTags = null;
  if (screen === 'follow') { S.followCompany = param || 'c1'; S.voice = null; S.photos = 0; S.followType = '电话'; S.followNext = '3 天后'; }
  S.modal = null;
  render(); view.scrollTop = 0;
}

  const h = S.hist.pop();
  if (h) { S.screen = h.s; S.param = h.p; S.ctab = h.c || '概览'; S.modal = null; render(); view.scrollTop = 0; }
}

function applyFilter(kw){
  kw = (kw || '').trim().toLowerCase();
  document.querySelectorAll('#bizList .row').forEach(r => {
    const t = (r.dataset.text || '').toLowerCase();
    r.style.display = (!kw || t.indexOf(kw) >= 0) ? '' : 'none';
  });
  const cnt = document.getElementById ? document.getElementById('listCount') : null;
  if (cnt){
    const rows = document.querySelectorAll('#bizList .row');
    let n = 0;
    rows.forEach(r => { if (r.style.display !== 'none') n++; });
    cnt.textContent = kw ? ('筛选出 ' + n + ' 家') : ('共 ' + n + ' 家合作商');
  }
  document.querySelectorAll('.pad > .card[data-text]').forEach(r => {
    const t = (r.dataset.text || '').toLowerCase();
    r.style.display = (!kw || t.indexOf(kw) >= 0) ? '' : 'none';
  });
}
function render(){
  document.querySelectorAll('.mask').forEach(m => m.remove());
  const fn = SCREENS[S.screen] || SCREENS.partners;
  view.innerHTML = fn();
  renderTabbar();
  renderRail();
  renderMeta();
  if (S.modal === 'lose') $('#app').insertAdjacentHTML('beforeend', loseSheet());
  if (S.modal === 'tags') $('#app').insertAdjacentHTML('beforeend', tagsSheet());
  if (S.modal === 'channel') $('#app').insertAdjacentHTML('beforeend', channelSheet());
  if (S.modal === 'plan') $('#app').insertAdjacentHTML('beforeend', planSheet());
  if (S.modal === 'sources') $('#app').insertAdjacentHTML('beforeend', sourcesSheet());
  if (S.modal === 'followAct') $('#app').insertAdjacentHTML('beforeend', followActSheet());
  if (S.modal === 'status') $('#app').insertAdjacentHTML('beforeend', statusSheet());
  const q = $('#q');
  if (q){
    q.addEventListener('input', e => { S.q = e.target.value; applyFilter(S.q); });
    if (S.q) applyFilter(S.q);
    if (S.searching && q.focus) q.focus();
  }
}

/* ============================================================ 事件 */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'jump'){ go(el.dataset.sc, el.dataset.pm || null); return; }
  if (act === 'back'){ back(); return; }
  if (act === 'tab'){ S.hist = []; go(el.dataset.tab); return; }
  if (act === 'go'){
    go(el.dataset.to, el.dataset.id || null);
    /* 从待跟进列表点进来要直接停在「跟进」页签，而不是默认的概览 */
    if (el.dataset.tab){ S.ctab = el.dataset.tab; render(); }
    return;
  }
  if (act === 'ctab'){ S.ctab = el.dataset.tab; render(); return; }
  if (act === 'seg'){ S.leadSeg = el.dataset.seg; render(); return; }
  if (act === 'chip'){ S.filters[el.dataset.group] = el.dataset.value; render(); return; }
  if (act === 'toast'){ toast(el.dataset.msg || '原型演示'); return; }
  if (act === 'call'){
    /* 取主联系人电话，调系统拨号；原型只提示 */
    toast('正在拨打 ' + (el.dataset.name || '') + ' ' + (el.dataset.phone || ''));
    return;
  }
  if (act === 'noop'){ return; }
  if (act === 'search'){ S.searching = true; render(); return; }
  if (act === 'cancel-search'){ S.searching = false; S.q = ''; render(); return; }

  if (act === 'code'){
    if (S.codeTimer) return;
    let n = 60;
    el.textContent = n + 's';
    S.codeTimer = setInterval(() => {
      n--;
      if (n <= 0){ clearInterval(S.codeTimer); S.codeTimer = null; el.textContent = '获取验证码'; }
      else el.textContent = n + 's';
    }, 1000);
    toast('验证码已发送（原型不真发短信）');
    return;
  }
  if (act === 'login'){
    S.hist = [];
    toast('登录成功，欢迎回来');
    go('partners');
    return;
  }
  if (act === 'logout'){ S.hist = []; go('login'); toast('已退出登录'); return; }

  if (act === 'claim'){
    const idx = DB.pool.findIndex(p => p.id === el.dataset.id);
    if (idx >= 0){
      const p = DB.pool.splice(idx,1)[0];
      DB.leads.unshift({id:'l'+Date.now(), name:p.name, src:p.channel, contact:'待补充', phone:'待补充',
        status:'待跟进', city:p.city, owner:DB.me.name, created:'11-20'});
      toast('已认领，转入「我的发现」，可继续跟进');
      render();
    }
    return;
  }
  if (act === 'discard'){
    DB.pool = DB.pool.filter(p => p.id !== el.dataset.id);
    toast('已丢弃，30 天内可在回收站找回');
    render();
    return;
  }
  if (act === 'ch'){
    const ch = DB.channels.find(c => c.id === el.dataset.id);
    if (ch){ ch.on = !ch.on; render(); toast(ch.name + (ch.on ? ' 已开启' : ' 已暂停')); }
    return;
  }
  if (act === 'plan-new'){
    S.planTarget = el.dataset.id; S.planEdit = false;
    S.planDraft = {date:'2026-11-23', note:''};
    S.modal = 'plan'; render(); return;
  }
  if (act === 'plan-edit'){
    const c0 = comp(el.dataset.id), p0 = planOf(el.dataset.id);
    S.planTarget = el.dataset.id; S.planEdit = true;
    S.planDraft = p0 ? {date:p0.date, note:p0.note} : {date:'2026-11-23', note:''};
    S.modal = 'plan'; render(); return;
  }
  if (act === 'plan-date'){ S.planDraft.date = el.dataset.v; render(); return; }
  if (act === 'plan-save'){
    const d = S.planDraft || {};
    const inp = $('#plan-note');
    const note = (inp ? inp.value.trim() : '') || d.note || '';
    const id = S.planTarget;
    if (!note){ toast('请填写跟进事项'); return; }
    const item = {date:d.date || '2026-11-23', note:note, by:DB.me.name};
    DB.plans[id] = item;
    S.modal = null; S.planDraft = null; S.planEdit = false;
    render(); toast('已保存跟进计划：' + planShort(item.date) + ' · ' + note);
    return;
  }
  if (act === 'plan-done'){
    const id = el.dataset.id;
    DB.plans[id] = null;
    render();
    toast('已标记完成，该合作商暂无计划（会排到首页最后），请补充下一条');
    return;
  }
  if (act === 'ch-new'){
    S.chEdit = null;
    S.chDraft = {name:'', url:'', kw:'', freq:'每日 08:00', scope:'全国'};
    S.modal = 'channel'; render(); return;
  }
  if (act === 'ch-edit'){
    const ch = DB.channels.find(c => c.id === el.dataset.id);
    if (!ch) return;
    S.chEdit = ch.id;
    S.chDraft = {name:ch.name, url:ch.url, kw:ch.kw, freq:ch.freq, scope:ch.scope};
    S.modal = 'channel'; render(); return;
  }
  if (act === 'ch-freq'){ S.chDraft.freq = el.dataset.v; render(); return; }
  if (act === 'ch-save'){
    const d = S.chDraft || {};
    const g = id => { const e = $('#' + id); return e ? e.value.trim() : ''; };
    const name = g('ch-name') || d.name || '';
    if (!name){ toast('请填写渠道名称'); return; }
    const payload = {name:name, url:g('ch-url') || d.url || '', kw:g('ch-kw') || d.kw || '',
      freq:d.freq || '每日 08:00', scope:g('ch-scope') || d.scope || '全国'};
    if (S.chEdit){
      const ch = DB.channels.find(c => c.id === S.chEdit);
      if (ch) Object.assign(ch, payload);
      toast('已保存「' + name + '」的配置');
    } else {
      DB.channels.push({id:'ch' + Date.now(), type:'自定义', on:true, last:'—', hit:0, ...payload});
      toast('已新增渠道「' + name + '」');
    }
    S.modal = null; S.chDraft = null; S.chEdit = null; render(); return;
  }
  if (act === 'ch-del'){
    const ch = DB.channels.find(c => c.id === S.chEdit);
    DB.channels = DB.channels.filter(c => c.id !== S.chEdit);
    S.modal = null; S.chDraft = null; S.chEdit = null; render();
    toast('已删除渠道' + (ch ? '「' + ch.name + '」' : ''));
    return;
  }
  if (act === 'collect'){
    if (el.disabled) return;
    el.disabled = true; el.textContent = '采集中…（模拟 1.2 秒）';
    setTimeout(() => {
      DB.pool.unshift({id:'p'+Date.now(), name:'杭州云途商旅（新增）', channel:'招标网',
        detail:'某省属企业 2027 差旅服务采购 · 二次公告', found:'11-20 14:35', city:'杭州',
        snippet:'报名截止 12-10，要求具备酒店协议价资源与 7×24 预订服务能力'});
      DB.channels[1].hit += 1; DB.channels[1].last = '11-20';
      toast('采集完成：新增 1 条线索进待确认池');
      S.leadSeg = 'pool';
      S.screen = 'discover'; S.param = null;
      render();
    }, 1200);
    return;
  }
  if (act === 'vtype'){ S.followType = el.dataset.v; render(); return; }
  if (act === 'vnext'){ S.followNext = el.dataset.v; render(); return; }
  if (act === 'newlevel'){ S.newLevel = el.dataset.level; render(); return; }
  if (act === 'newtype'){ S.newType = el.dataset.v; render(); return; }
  if (act === 'newstatus'){ S.newStatus = el.dataset.v; render(); return; }
  if (act === 'newline'){
    const l = el.dataset.v;
    const cur = S.newLines || [];
    S.newLines = cur.indexOf(l) >= 0 ? cur.filter(x => x !== l) : cur.concat([l]);
    render(); return;
  }
  if (act === 'newtag'){
    const t = el.dataset.tag;
    if (S.newTags.indexOf(t) >= 0) S.newTags = S.newTags.filter(x => x !== t);
    else S.newTags = S.newTags.concat([t]);
    if (!S.newTags.length) S.newTags = [DB.tags[0]];
    render(); return;
  }

  /* ---- 跟进记录：编辑 / 删除（PRD 12.8） ---- */
  if (act === 'follow-more'){
    S.actTarget = {cid: el.dataset.cid, i: Number(el.dataset.i)};
    S.modal = 'followAct'; render(); return;
  }
  if (act === 'follow-edit'){
    const t = S.actTarget || {};
    S.editFollow = {cid: t.cid, idx: t.i};
    S.modal = null; S.draft = {};
    go('follow', t.cid);
    return;
  }
  if (act === 'follow-del'){
    const t = S.actTarget || {};
    const arr = DB.follows[t.cid] || [];
    if (arr[t.i]) arr[t.i].deleted = true;   /* 软删，保留占位 */
    S.modal = null; render();
    toast('已删除，时间轴保留占位');
    return;
  }

  /* ---- 来源字典（PRD 11.2） ---- */
  if (act === 'sources'){ S.modal = 'sources'; render(); return; }
  if (act === 'src-del'){
    if (DB.sources.length <= 1){ toast('至少保留一个来源'); return; }
    DB.sources.splice(Number(el.dataset.i), 1);
    render(); return;
  }
  if (act === 'src-add'){
    const inp = $('#newSrc');
    const v = inp ? inp.value.trim() : '';
    if (!v){ toast('请输入来源名'); return; }
    if (DB.sources.indexOf(v) >= 0){ toast('来源已存在'); return; }
    DB.sources.push(v);
    if (inp) inp.value = '';
    render(); toast('已添加来源「' + v + '」'); return;
  }

  /* ---- 合作状态流转（PRD 8.4）：变更即写一条系统跟进 ---- */
  if (act === 'status-open'){
    S.statusTarget = el.dataset.id; S.modal = 'status'; render(); return;
  }
  if (act === 'pick-status'){
    const c = comp(S.statusTarget);
    const s = el.dataset.s;
    if (c && c.status !== s){
      const old = c.status;
      c.status = s;
      DB.follows[c.id] = DB.follows[c.id] || [];
      DB.follows[c.id].unshift({date:'11-20', type:'系统', by:DB.me.name,
        text:'合作状态由「' + old + '」变更为「' + s + '」', next:''});
    }
    S.modal = null; render();
    toast('已变更为「' + s + '」，并写入时间轴');
    return;
  }

  if (act === 'save-follow'){
    const cid = S.followCompany || 'c1';
    const ta = $('#f-text');
    const text = ta ? ta.value.trim() : '';
    if (!text){ toast('请填写跟进内容'); return; }
    /* 编辑模式：只更新内容，不碰计划（避免改错字把手滑成重排） */
    if (S.editFollow && S.editFollow.cid === cid){
      const arr = DB.follows[cid] || [];
      if (arr[S.editFollow.idx]){
        arr[S.editFollow.idx].text = text;
        arr[S.editFollow.idx].type = S.followType || arr[S.editFollow.idx].type;
      }
      S.editFollow = null; S.draft = {}; S.followType = '电话';
      back(); S.ctab = '跟进'; render();
      toast('已更新这条跟进，计划保持不变');
      return;
    }
    DB.follows[cid] = DB.follows[cid] || [];
    DB.follows[cid].unshift({date:'11-20', type:S.followType || '电话', by:DB.me.name,
      text:text, next:S.followNext || '3 天后'});
    const dmap = {'明天':'2026-11-21', '3 天后':'2026-11-23', '下周一':'2026-11-23'};
    DB.plans[cid] = {date:dmap[S.followNext] || '2026-11-23',
      note:(text || '跟进下次沟通').slice(0, 18), by:DB.me.name};
    S.voice = null; S.photos = 0; S.followType = '电话'; S.draft = {};
    back(); S.ctab = '跟进'; render();
    toast('已保存，并写入该企业时间轴');
    return;
  }
  if (act === 'advance'){
    const d = dealOf(el.dataset.id);
    if (d && d.stage < 4){
      d.stage++;
      toast(d.stage >= 4 ? '恭喜，已标记赢单' : '已推进到「' + ['接洽','试单','报价','签约','赢单'][d.stage] + '」');
      render();
    }
    return;
  }
  if (act === 'lose'){ S.modal = 'lose'; render(); return; }
  if (act === 'pick-lose'){
    document.querySelectorAll('.opt button').forEach(b => b.classList.remove('on'));
    el.classList.add('on'); S.loseReason = el.dataset.r; return;
  }
  if (act === 'close-modal'){ if (e.target === el){ S.modal = null; render(); } return; }
  if (act === 'confirm-lose'){
    const dd = DB.deals.find(x => x.id === S.param) || DB.deals[0];
    dd.stage = 4; dd.lost = S.loseReason || '价格';
    S.modal = null; render();
    toast('已标记输单，原因：' + dd.lost);
    return;
  }
  if (act === 'save-company'){
    const name = ($('#n-name') && $('#n-name').value.trim()) || '';
    if (!name){ toast('请填写企业名称'); return; }
    const short = ($('#n-short') && $('#n-short').value.trim()) || name.slice(0,4);
    const city = ($('#n-city') && $('#n-city').value.trim()) || '未填写';
    const credit = ($('#n-credit') && $('#n-credit').value.trim()) || '待补充';
    const desc = ($('#n-desc') && $('#n-desc').value.trim()) || '新建档案，待补充简介';
    const industry = ($('#n-industry') && $('#n-industry').value.trim()) || '待补充';
    const addr = ($('#n-addr') && $('#n-addr').value.trim()) || '待补充';
    const web = ($('#n-web') && $('#n-web').value.trim()) || '待补充';
    const tagOn = (S.newTags && S.newTags.length) ? S.newTags : [DB.tags[0]];
    const id = 'n' + Date.now();
    DB.companies.unshift({id:id, name:name, short:short, level:S.newLevel || '重点',
      status:'潜在', city:city, owner:DB.me.name, industry:industry,
      credit:credit, addr:addr, web:web,
      tags:tagOn,
      contacts:[], deals:[], attach:[], brief:desc});
    DB.follows[id] = [];
    S.newTags = [DB.tags[0]]; S.draft = {}; S.newLevel = '重点';
    toast('已保存，查重通过（无同名企业）');
    S.hist = [];
    go('partners');
    return;
  }
  /* 标签管理 */
  if (act === 'tags'){ S.modal = 'tags'; render(); return; }
  if (act === 'close-modal2'){ S.modal = null; render(); return; }
  if (act === 'tag-del'){
    if (DB.tags.length <= 1){ toast('至少保留一个标签'); return; }
    DB.tags.splice(Number(el.dataset.i), 1);
    render(); return;
  }
  if (act === 'tag-add'){
    const inp = $('#newTag');
    const v = inp ? inp.value.trim() : '';
    if (!v){ toast('请输入标签名'); return; }
    if (DB.tags.indexOf(v) >= 0){ toast('标签已存在'); return; }
    DB.tags.push(v);
    if (inp) inp.value = '';
    render(); toast('已添加标签「' + v + '」'); return;
  }
  if (act === 'go-channels'){ S.modal = null; go('channels'); return; }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t && t.id && (t.id === 'f-text' || t.id.indexOf('n-') === 0)) S.draft[t.id] = t.value;
  if (t && t.id === 'plan-note' && S.planDraft) S.planDraft.note = t.value;
  const map = {'ch-name':'name', 'ch-url':'url', 'ch-kw':'kw', 'ch-scope':'scope'};
  if (t && t.id && map[t.id] && S.chDraft) S.chDraft[map[t.id]] = t.value;
});

document.addEventListener('change', e => {
  const t = e.target;
  /* 来源字典改名：同步已有发现记录 */
  if (t && t.dataset && t.dataset.srcI !== undefined){
    const i = Number(t.dataset.srcI), v = t.value.trim();
    if (!v){ t.value = DB.sources[i]; return; }
    if (DB.sources.indexOf(v) >= 0 && DB.sources.indexOf(v) !== i){ toast('来源名重复'); t.value = DB.sources[i]; return; }
    const old = DB.sources[i];
    DB.sources[i] = v;
    DB.leads.forEach(l => { if (l.src === old) l.src = v; });
    toast('已重命名为「' + v + '」');
    return;
  }
  if (t && t.dataset && t.dataset.tagI !== undefined){
    const i = Number(t.dataset.tagI), v = t.value.trim();
    if (!v){ t.value = DB.tags[i]; return; }
    if (DB.tags.indexOf(v) >= 0 && DB.tags.indexOf(v) !== i){ toast('标签名重复'); t.value = DB.tags[i]; return; }
    const old = DB.tags[i];
    DB.tags[i] = v;
    DB.companies.forEach(c => {
      const k = (c.tags || []).indexOf(old);
      if (k >= 0) c.tags[k] = v;
    });
    if (S.filters.tag === old) S.filters.tag = v;
    toast('已重命名为「' + v + '」');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ S.modal = null; render(); }
});

/* ============================================================ 启动 */
const startHash = (location.hash || '').replace('#','');
if (startHash === 'tags'){                 /* 深链：#tags 标签管理弹层 */
  go('partners'); S.modal = 'tags'; render();
} else if (startHash === 'sources'){       /* 深链：#sources 来源字典弹层 */
  go('mine'); S.modal = 'sources'; render();
} else if (startHash === 'follow-edit'){   /* 深链：#follow-edit 跟进编辑态 */
  go('follow', 'c1');
  S.editFollow = {cid:'c1', idx:0}; render();
} else if (startHash === 'search'){        /* 深链：#search 搜索展开态 */
  go('partners'); S.searching = true; S.q = '中航'; render();
} else if (startHash === 'channel-edit'){  /* 深链：#channel-edit 渠道编辑弹层 */
  go('channels');
  var c0 = DB.channels[0];
  S.chEdit = c0.id;
  S.chDraft = {name:c0.name, url:c0.url, kw:c0.kw, freq:c0.freq, scope:c0.scope};
  S.modal = 'channel'; render();
} else if (startHash === 'plan'){        /* 深链：#plan 跟进计划弹层 */
  go('company', 'c1'); S.ctab = '跟进';
  S.planTarget = 'c1'; S.planEdit = true;
  S.planDraft = {date:'2026-11-25', note:'给 2027 年度框架续签报价（含华南区覆盖方案）'};
  S.modal = 'plan'; render();
} else if (startHash && SCREENS[startHash.split('/')[0]]){
  const hp = startHash.split('/');
  go(hp[0], hp[1] ? decodeURIComponent(hp[1]) : null);
  if (hp[2]) { S.ctab = decodeURIComponent(hp[2]); render(); }
} else {
  go('partners');
}
window.addEventListener('hashchange', () => {
  const h = (location.hash || '').replace('#','');
  const hp = h.split('/');
  if (hp[0] && SCREENS[hp[0]]){
    go(hp[0], hp[1] ? decodeURIComponent(hp[1]) : null);
    if (hp[2]) { S.ctab = decodeURIComponent(hp[2]); render(); }
  }
});
</script>
</body>
</html>
